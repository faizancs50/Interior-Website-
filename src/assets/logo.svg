<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none" width="280" height="48">
  <!-- Minimalist Architectural Monogram -->
  <g transform="translate(4, 6)">
    <rect x="0" y="0" width="34" height="34" stroke="currentColor" stroke-width="1.75" fill="none"/>
    <line x1="0" y1="17" x2="34" y2="17" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>
    <line x1="17" y1="0" x2="17" y2="34" stroke="currentColor" stroke-width="1.2" opacity="0.6"/>
    <polygon points="17,6 28,17 17,28 6,17" fill="none" stroke="#A59682" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="2.5" fill="currentColor"/>
  </g>

  <!-- Typography -->
  <text x="52" y="24" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="22" font-weight="600" letter-spacing="4.5" fill="currentColor">
    CARPENTERS
  </text>
  <text x="53" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" letter-spacing="3" fill="#A59682">
    DESIGN &amp; RENOVATION
  </text>
</svg>
